[workspace]
resolver = "3"
members = ["crates/feline-core", "crates/feline-desktop"]
default-members = ["crates/feline-desktop"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1.52.1", default-features = false }
tokio-stream = { version = "0.1.17", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "query", "rustls", "gzip", "brotli", "http2"] }
rustls = "0.23.39"
rustls-pki-types = "1.14.0"
rustls-platform-verifier = "0.6.2"
tracing = "0.1.44"
governor = "0.10.4"
backon = { version = "1.6.0", features = ["tokio-sleep"] }
md-5 = "0.11.0"
hex = "0.4.3"
time = { version = "0.3.47", features = ["serde", "formatting", "macros"] }
url = "2.5.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
