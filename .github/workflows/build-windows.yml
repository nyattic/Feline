name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build feline.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --locked --release

      - name: Rename executable
        shell: pwsh
        run: Copy-Item target/release/feline.exe "Feline-${{ github.ref_name }}-windows-x86_64.exe"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: feline-windows-x86_64
          path: Feline-${{ github.ref_name }}-windows-x86_64.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Feline-${{ github.ref_name }}-windows-x86_64.exe
          generate_release_notes: true
