version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Pinned in lockstep with rust-toolchain.toml and Cargo.toml's rust-version.
      - dependency-name: dtolnay/rust-toolchain
